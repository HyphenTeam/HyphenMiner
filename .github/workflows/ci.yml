name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout Hyphen consensus tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HyphenTeam/Hyphen
          path: .hyphen-base
          persist-credentials: false
      - name: Materialize sibling consensus crates
        shell: pwsh
        run: |
          Copy-Item .hyphen-base/Cargo.toml ../Cargo.toml -Force
          Copy-Item .hyphen-base/LICENSE ../LICENSE -Force
          if (Test-Path ../src) { Remove-Item ../src -Recurse -Force }
          Copy-Item .hyphen-base/src ../src -Recurse
          if (Test-Path ../crates) { Remove-Item ../crates -Recurse -Force }
          Copy-Item .hyphen-base/crates ../crates -Recurse
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked

  windows-smoke:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout Hyphen consensus tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HyphenTeam/Hyphen
          path: .hyphen-base
          persist-credentials: false
      - name: Materialize sibling consensus crates
        shell: pwsh
        run: |
          Copy-Item .hyphen-base/Cargo.toml ../Cargo.toml -Force
          Copy-Item .hyphen-base/LICENSE ../LICENSE -Force
          if (Test-Path ../src) { Remove-Item ../src -Recurse -Force }
          Copy-Item .hyphen-base/src ../src -Recurse
          if (Test-Path ../crates) { Remove-Item ../crates -Recurse -Force }
          Copy-Item .hyphen-base/crates ../crates -Recurse
      - run: rustup toolchain install 1.97.0 --profile minimal
      - run: rustup default 1.97.0
      - run: cargo build --release --locked
      - run: ./target/release/hyphen-miner.exe --help
