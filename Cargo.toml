[package]
name = "hyphen-miner"
version = "0.1.1"
edition = "2021"
authors = ["Hyphen Contributors"]
license = "PolyForm-Strict-1.0.0"
description = "Hyphen miner: searches single-use Cunningham witness chains for the PoUW v3 chain"

[workspace]

[[bin]]
name = "hyphen-miner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
courierust = "1.0.9"
# Hyphen protocol crates are consumed from a pinned public revision, never from
# a local checkout: this repository's CI must build from a clean clone.
hyphen-core = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
hyphen-pow = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "576bc67d972d1156fbabb1ddf579104d5ff2ff88" }
parking_lot = "0.12"
prost = "0.14.4"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }