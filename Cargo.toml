[package]
name = "hyphen-miner"
version = "0.1.1"
edition = "2021"
authors = ["Hyphen Contributors"]
license = "PolyForm-Strict-1.0.0"
description = "Hyphen miner: searches single-use Cunningham witness chains for the PoUW v3 chain"

[workspace]

[[bin]]
name = "hyphen-miner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
courierust = "1.0.9"
hyphen-core = { path = "../crates/hyphen-core" }
hyphen-crypto = { path = "../crates/hyphen-crypto" }
hyphen-pow = { path = "../crates/hyphen-pow" }
parking_lot = "0.12"
prost = "0.14.4"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }