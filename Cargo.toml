[package]
name = "hyphen-miner"
version = "0.1.2"
edition = "2024"
authors = ["blueokanna", "HyphenTeam"]
license-file = "LICENSE"
description = "Hyphen miner: searches nonce-bound neural block work with a memory-hard gate"

[workspace]

[[bin]]
name = "hyphen-miner"
path = "src/main.rs"

[dependencies]
redb = "5.0.0"
tempfile = "3.27.0"
hyphen-core = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-pow = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }
hyphen-neural = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "8bb9f0f4c43f1fba8a20bbcb1a0e93b907ccccb7" }

blake3 = "1.8.7"
clap = { version = "4.6.8", features = ["derive"] }
courierust = "1.1.3"
parking_lot = "0.13.0"
prost = "0.14.6"
libloading = "0.9.1"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
