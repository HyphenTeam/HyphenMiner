[package]
name = "hyphen-miner"
version = "0.1.1"
edition = "2021"
authors = ["blueokanna","HyphenTeam"]
license-file = "LICENSE"
description = "Hyphen miner: searches single-use Cunningham witness chains for the PoUW v3 chain"

[workspace]

[[bin]]
name = "hyphen-miner"
path = "src/main.rs"

[dependencies]
hyphen-core = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "c57f908464df6634eba829e8267f9c5330b3a4b4" }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "c57f908464df6634eba829e8267f9c5330b3a4b4" }
hyphen-pow = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "c57f908464df6634eba829e8267f9c5330b3a4b4" }
hyphen-neural = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "c57f908464df6634eba829e8267f9c5330b3a4b4" }

blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
courierust = "1.0.9"
parking_lot = "0.12"
prost = "0.14.4"
libloading = "0.9"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
